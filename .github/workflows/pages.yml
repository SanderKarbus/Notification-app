name: Avalda GitHub Pagesis

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Lae projekti failid
        uses: actions/checkout@v4

      - name: Seadista Pages
        uses: actions/configure-pages@v5

      - name: Koosta staatiline Pagesi pakett
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Avalda GitHub Pagesis
        id: deployment
        uses: actions/deploy-pages@v4
